name: mini-colo

topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:9.1.0
      binds:
        - configs/r1/daemons:/etc/frr/daemons
        - configs/r1/frr.conf:/etc/frr/frr.conf
        - configs/r1/vtysh.conf:/etc/frr/vtysh.conf
    r2:
      kind: linux
      image: quay.io/frrouting/frr:9.1.0
      binds:
        - configs/r2/daemons:/etc/frr/daemons
        - configs/r2/frr.conf:/etc/frr/frr.conf
        - configs/r2/vtysh.conf:/etc/frr/vtysh.conf
    r3:
      kind: linux
      image: quay.io/frrouting/frr:9.1.0
      binds:
        - configs/r3/daemons:/etc/frr/daemons
        - configs/r3/frr.conf:/etc/frr/frr.conf
        - configs/r3/vtysh.conf:/etc/frr/vtysh.conf
    isp:
      kind: linux
      image: quay.io/frrouting/frr:9.1.0
      binds:
        - configs/isp/daemons:/etc/frr/daemons
        - configs/isp/frr.conf:/etc/frr/frr.conf
        - configs/isp/vtysh.conf:/etc/frr/vtysh.conf
    exch:
      kind: linux
      image: quay.io/frrouting/frr:9.1.0
      binds:
        - configs/exch/daemons:/etc/frr/daemons
        - configs/exch/frr.conf:/etc/frr/frr.conf
        - configs/exch/vtysh.conf:/etc/frr/vtysh.conf
    host1:
      kind: linux
      image: wbitt/network-multitool:alpine-minimal
      exec:
        - ip addr add 10.1.1.10/24 dev eth1
        - ip route replace default via 10.1.1.1
    host2:
      kind: linux
      image: wbitt/network-multitool:alpine-minimal
      exec:
        - ip addr add 10.2.2.10/24 dev eth1
        - ip route replace default via 10.2.2.1

  links:
    - endpoints: ["host1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "host2:eth1"]
    - endpoints: ["r2:eth3", "r3:eth1"]
    - endpoints: ["r1:eth3", "isp:eth1"]
    - endpoints: ["r3:eth2", "exch:eth1"]
